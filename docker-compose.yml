services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mirsonix
      POSTGRES_PASSWORD: mirsonix
      POSTGRES_DB: mirsonix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirsonix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
